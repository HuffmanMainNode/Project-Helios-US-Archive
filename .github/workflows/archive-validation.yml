name: Archive integrity and provenance checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional API client test dependency
        run: python -m pip install -r requirements-courtlistener.txt
      - name: Run archive audit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit archive files
        run: python scripts/archive_audit.py --root . --output "$RUNNER_TEMP/archive-audit.json"
